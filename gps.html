<!DOCTYPE html>
<html>

<head>

    <title>GPS Campus</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- ICONS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- LEAFLET -->
    <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<!-- MAP -->
<div id="map"></div>

<!-- TOP FLOATING CARD -->
<div class="gps-floating-card">

    <div class="gps-top-row">

        <div>

            <p>

                Localisation actuelle

            </p>

            <h2>

                Smart Campus COUD

            </h2>

        </div>

        <div class="gps-avatar">

            <i class="fa-solid fa-location-dot"></i>

        </div>

    </div>

    <!-- ACTIONS -->
    <div class="gps-actions">

        <button onclick="partagerPosition()">

            <i class="fa-solid fa-share-nodes"></i>

            Partager

        </button>

        <button onclick="initialiserCarte()">

            <i class="fa-solid fa-location-crosshairs"></i>

            Recentrer

        </button>

    </div>

</div>

<!-- FLOAT BUTTON -->
<button class="gps-floating-button"
        onclick="partagerPosition()">

    <i class="fa-solid fa-location-arrow"></i>

</button>

<!-- NAVBAR -->
<nav class="ios-navbar">

    <!-- HOME -->
    <a href="dashboard.html">

        <i class="fa-solid fa-house"></i>

    </a>

    <!-- NOTIFICATIONS -->
    <a href="notifications.html"
   class="nav-bell">

    <i class="fa-solid fa-bell"></i>

    <div id="notification-badge"
         class="notification-badge">

    </div>

</a>

    <!-- PROFILE -->
    <a href="profile.html">

        <i class="fa-solid fa-user"></i>

    </a>

</nav>
<!-- LEAFLET -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- SCRIPT -->
<script src="script.js"></script>

<script>

verifierConnexion("etudiant");

initialiserCarte();

</script>

</body>
</html>
