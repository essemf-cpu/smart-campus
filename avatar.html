<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Avatar Smart Campus</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="mobile-container">

<div class="avatar-container">

<h1 class="avatar-title">

Choisir mon avatar

</h1>

<p class="avatar-subtitle">

Choisis ton identité Smart Campus

</p>

<select
id="style"
class="avatar-input">

<option value="avataaars">

Bitmoji Style

</option>

<option value="personas">

Cartoon 3D

</option>

</select>

<input

id="seed"

class="avatar-input"

placeholder="Ton nom">

<div class="avatar-preview-container">

<img

id="avatar-image"

class="avatar-preview"

style="display:none;">

</div>

<div class="avatar-buttons">

<button
class="avatar-btn"

onclick="genererAvatar()">

Générer

</button>

<button
class="avatar-btn save-btn"

onclick="sauvegarderAvatar()">

Enregistrer

</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
