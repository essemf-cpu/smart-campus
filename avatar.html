<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Choisir mon avatar

</title>

<link
rel="stylesheet"
href="style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="mobile-container">

<!-- HEADER -->

<div class="avatar-header">

<button
class="back-avatar-btn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div>

<h1 class="avatar-title">

Choisir mon avatar

</h1>

<p class="avatar-subtitle">

Choisis l’avatar qui te représente sur Smart Campus

</p>

</div>

</div>

<!-- PREVIEW -->

<div class="avatar-preview-card">

<img
id="selected-avatar"
class="selected-avatar"
src="assets/avatars/avatar1.png">

<div class="avatar-security">

<i class="fa-solid fa-shield-halved"></i>

<div>

<strong>

100% privé

</strong>

<p>

Aucune photo réelle utilisée

</p>

</div>

</div>

</div>

<!-- FILTRES -->

<div class="avatar-filters">

<button
class="active-filter">

Tous

</button>

<button>

Garçons

</button>

<button>

Filles

</button>

<button>

Diversité

</button>

</div>

<!-- GRID -->

<div class="avatar-grid">

<img
src="assets/avatars/avatar1.png"
onclick="selectionAvatar(this)">

<img
src="assets/avatars/avatar2.png"
onclick="selectionAvatar(this)">

<img
src="assets/avatars/avatar3.png"
onclick="selectionAvatar(this)">

<img
src="assets/avatars/avatar4.png"
onclick="selectionAvatar(this)">

<img
src="assets/avatars/avatar5.png"
onclick="selectionAvatar(this)">

<img
src="assets/avatars/avatar6.png"
onclick="selectionAvatar(this)">

<img
src="assets/avatars/avatar7.png"
onclick="selectionAvatar(this)">

<img
src="assets/avatars/avatar8.png"
onclick="selectionAvatar(this)">

<img
src="assets/avatars/avatar9.png"
onclick="selectionAvatar(this)">

<img
src="assets/avatars/avatar10.png"
onclick="selectionAvatar(this)">

<img
src="assets/avatars/avatar11.png"
onclick="selectionAvatar(this)">

<img
src="assets/avatars/avatar12.png"
onclick="selectionAvatar(this)">

</div>

<!-- BUTTONS -->

<div class="avatar-actions">

<button
class="cancel-avatar-btn"
onclick="history.back()">

Annuler

</button>

<button
class="save-avatar-btn"
onclick="sauvegarderAvatarChoisi()">

Valider mon avatar

</button>

</div>

</div>

<script src="script.js"></script>

<script>

let avatarChoisi =
"assets/avatars/avatar1.png";

function selectionAvatar(img){

document
.querySelectorAll(
".avatar-grid img"
)

.forEach((a)=>{

a.classList.remove(
"avatar-selected"
);

});

img.classList.add(
"avatar-selected"
);

avatarChoisi =
img.src;

document
.getElementById(
"selected-avatar"
)
.src =
img.src;

}

</script>

</body>
</html>
