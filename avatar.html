<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Avatar Smart Campus</title>

<link
rel="stylesheet"
href="style.css">

<script src="script.js"></script>

</head>

<body class="avatar-page">

<div class="avatar-builder">

<!-- PREVIEW -->

<div class="avatar-preview">

<div id="avatar">

<img id="skin-layer">
<img id="clothes-layer">
<img id="eyes-layer">
<img id="mouth-layer">
<img id="hair-layer">

</div>

</div>

<!-- CONTROLS -->

<div class="avatar-controls">

<h2>Cheveux</h2>

<div class="avatar-grid">

<button onclick="changerCheveux(1)">
1
</button>

<button onclick="changerCheveux(2)">
2
</button>

<button onclick="changerCheveux(3)">
3
</button>

<button onclick="changerCheveux(4)">
4
</button>

</div>

<h2>Yeux</h2>

<div class="avatar-grid">

<button onclick="changerYeux(1)">
1
</button>

<button onclick="changerYeux(2)">
2
</button>

<button onclick="changerYeux(3)">
3
</button>

<button onclick="changerYeux(4)">
4
</button>

</div>

<h2>Vêtements</h2>

<div class="avatar-grid">

<button onclick="changerVetement(1)">
1
</button>

<button onclick="changerVetement(2)">
2
</button>

<button onclick="changerVetement(3)">
3
</button>

<button onclick="changerVetement(4)">
4
</button>

</div>

<button
class="save-avatar-btn"
onclick="sauvegarderAvatar()">

Enregistrer mon avatar

</button>

</div>

</div>

<script>

initialiserAvatar();

</script>

</body>
</html>
