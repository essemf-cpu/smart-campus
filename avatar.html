<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Choisir mon avatar

</title>

<link
rel="stylesheet"
href="style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="mobile-container">

<!-- HEADER -->

<div class="avatar-header">

<button
class="back-avatar-btn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div>

<h1 class="avatar-title">

Choisir mon avatar

</h1>

<p class="avatar-subtitle">

Choisis ton identité Smart Campus

</p>

</div>

</div>

<!-- PREVIEW -->

<div class="avatar-preview-card">

<img
id="selected-avatar"
class="selected-avatar"
src="">

<div class="avatar-security">

<i class="fa-solid fa-shield-halved"></i>

<div>

<strong>

100% privé

</strong>

<p>

Aucune photo réelle utilisée

</p>

</div>

</div>

</div>

<!-- FILTRES -->

<div class="avatar-filters">

<button
class="active-filter"
onclick="filtrerAvatar('all',this)">

Tous

</button>

<button
onclick="filtrerAvatar('garcons',this)">

Garçons

</button>

<button
onclick="filtrerAvatar('filles',this)">

Filles

</button>

</div>

<!-- GRID -->

<div
id="avatar-grid"
class="avatar-grid">

<img
src="assets/avatars/garcons/g1.png">

<img
src="assets/avatars/garcons/g2.png">

<img
src="assets/avatars/filles/f1.png">

</div>

<!-- ACTIONS -->

<div class="avatar-actions">

<button
class="cancel-avatar-btn"
onclick="history.back()">

Annuler

</button>

<button
class="save-avatar-btn"
onclick="sauvegarderAvatarChoisi()">

Valider mon avatar

</button>

<button
class="cancel-avatar-btn"
onclick="supprimerAvatar()">

Supprimer mon avatar

</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
