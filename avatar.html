<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Avatar Smart Campus</title>

<link
rel="stylesheet"
href="style.css">

<script src="script.js"></script>

</head>

<body class="avatar-page">

<div class="avatar-container">

<h1>Créer mon avatar</h1>

<div class="avatar-preview">

<img
id="avatar-image"
src=""
alt="avatar">

</div>

<div class="avatar-controls">

<select id="style">

<option value="adventurer">
Adventurer
</option>

<option value="bottts">
Bottts
</option>

<option value="micah">
Micah
</option>

<option value="avataaars">
Avataaars
</option>

</select>

<input
type="text"
id="seed"
placeholder="Ton pseudo">

<button onclick="genererAvatar()">

Générer avatar

</button>

<button onclick="sauvegarderAvatar()">

Enregistrer

</button>

</div>

</div>

</body>
</html>
