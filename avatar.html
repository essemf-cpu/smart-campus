<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Choisir mon avatar</title>

<link rel="stylesheet"
href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="mobile-container">

<div class="avatar-header">

<button
class="back-avatar-btn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div>

<h1 class="avatar-title">
Choisir mon avatar
</h1>

<p class="avatar-subtitle">
Choisis ton identité Smart Campus
</p>

</div>

</div>


<div class="avatar-preview-card">

<img
id="selected-avatar"
class="selected-avatar"
src="assets/default-user.png">

<div class="avatar-security">

<i class="fa-solid fa-shield-halved"></i>

<div>

<strong>100% privé</strong>

<p>Aucune photo réelle utilisée</p>

</div>

</div>

</div>


<div class="avatar-filters">

<button
class="active-filter"
onclick="charger('all',this)">

Tous

</button>

<button
onclick="charger('garcons',this)">

Garçons

</button>

<button
onclick="charger('filles',this)">

Filles

</button>

</div>


<div
id="avatar-grid"
class="avatar-grid">

</div>


<div class="avatar-actions">

<button
class="cancel-avatar-btn"
onclick="history.back()">

Annuler

</button>

<button
class="save-avatar-btn"
onclick="sauvegarder()">

Valider mon avatar

</button>

<button
class="cancel-avatar-btn"
onclick="supprimerAvatar()">

Supprimer

</button>

</div>

</div>

let user=
JSON.parse(
localStorage.getItem("user")
);

let avatarChoisi=

user?.avatar ||

avatars.garcons[0];


function charger(type="all",btn=null){

let grid=
document.getElementById(
"avatar-grid"
);

grid.innerHTML="";

let liste=[];

if(type==="all"){

liste=[
...avatars.garcons,
...avatars.filles
];

}else{

liste=
avatars[type];

}


liste.forEach((avatar)=>{

grid.innerHTML+=`

<img
src="${avatar}"
class="avatar-item"
onclick="selection('${avatar}')">

`;

});

if(btn){

document
.querySelectorAll(
".avatar-filters button"
)

.forEach((b)=>{

b.classList.remove(
"active-filter"
);

});

btn.classList.add(
"active-filter");

}

}


function selection(src){

avatarChoisi=src;

document
.getElementById(
"selected-avatar"
)

.src=src;

}


function sauvegarder(){

let user =
JSON.parse(
localStorage.getItem(
"user"
)
);

if(!user)return;

console.log(
"avatarChoisi =",
avatarChoisi
);

db.collection("users")
.doc(user.id)

.update({

avatar:avatarChoisi

})

.then(()=>{

user.avatar =
avatarChoisi;

localStorage.setItem(

"user",
JSON.stringify(
user
)

);

alert(
"Avatar enregistré"
);

window.location.href=
"profile.html";

});

}


function supprimerAvatar(){

avatarChoisi=
avatars.garcons[0];

document
.getElementById(
"selected-avatar"
)

.src=
avatarChoisi;

}


window.onload=function(){

document
.getElementById(
"selected-avatar"
)

.src=
avatarChoisi;

charger();

};
