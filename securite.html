        <div class="input-box">

                   id="ancien-password"
                   placeholder="Ancien mot de passe">

        </div>

        <!-- NEW -->
        <div class="input-box">

            <i class="fa-solid fa-key"></i>

            <input type="password"
                   id="nouveau-password"
                   placeholder="Nouveau mot de passe">

        </div>

        <!-- CONFIRM -->
        <div class="input-box">

            <i class="fa-solid fa-check"></i>

            <input type="password"
                   id="confirm-password"
                   placeholder="Confirmer le mot de passe">

        </div>

        <!-- BUTTON -->
        <button class="auth-button"
                onclick="changerMotDePasse()">

<script>

function changerMotDePasse(){

let ancien =
document.getElementById(
"ancien-password"
).value;

let nouveau =
document.getElementById(
"nouveau-password"
).value;

let confirmation =
document.getElementById(
"confirm-password"
).value;

let user =
JSON.parse(
localStorage.getItem("user")
);

/* DATE */

let maintenant =
new Date();

/* DERNIER CHANGEMENT */

if(user.passwordLastChange){

let ancienneDate =
new Date(user.passwordLastChange);

let difference =
maintenant - ancienneDate;

let jours =
difference / (1000 * 60 * 60 * 24);

if(jours < 90){

let restant =
Math.ceil(90 - jours);

alert(
"Vous pourrez modifier votre mot de passe dans "
+ restant +
" jour(s)."
);

return;

}

}

/* VERIFICATION */

if(ancien !== user.password){

alert(
"Ancien mot de passe incorrect"
);

return;

}

/* CONFIRMATION */

if(nouveau !== confirmation){

alert(
"Les mots de passe ne correspondent pas"
);

return;

}

/* LONGUEUR */

if(nouveau.length < 6){

alert(
"Le mot de passe doit contenir au moins 6 caractères"
);

return;

}

/* UPDATE PASSWORD */

user.password = nouveau;

/* SAVE DATE */

user.passwordLastChange =
maintenant.toISOString();

/* SAVE */

localStorage.setItem(
"user",
JSON.stringify(user)
);

alert(
"Mot de passe modifié avec succès ✅"
);

/* RESET */

document.getElementById(
"ancien-password"
).value = "";

document.getElementById(
"nouveau-password"
).value = "";

document.getElementById(
"confirm-password"
).value = "";

}

</script>

</body>
