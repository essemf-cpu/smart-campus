<!DOCTYPE html>
<html>

<head>

<title>
Scanner Restaurant
</title>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<link
rel="stylesheet"
href="style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div class="mobile-container">

<!-- HEADER -->

<div class="guide-header">

<a href="controle-restaurant.html">

<i class="fa-solid fa-arrow-left"></i>

</a>

<h1>

Scanner Restaurant

</h1>

</div>


<!-- BANNER -->

<div class="premium-banner">

<div>

<h2>

Contrôle tickets restaurant

</h2>

<p>

Scanner étudiant • Défalquer ticket

</p>

</div>

<img
src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png">

</div>


<!-- CARD -->

<div class="wallet-card">

<h2>

Caméra contrôle

</h2>

<p class="wallet-subtitle">

Placez le QR étudiant
devant la caméra

</p>


<!-- CAMERA -->

<div
id="reader"

style="
width:100%;
margin-top:25px;
border-radius:24px;
overflow:hidden;
">

</div>


<!-- ZONE RESULTAT -->

<div
id="scan-zone"
class="history-section">

<div
class="history-card">

<div
class="history-icon purple-bg">

<i class="fa-solid fa-utensils"></i>

</div>

<div
class="history-info">

<strong
id="scan-result">

Aucun étudiant détecté

</strong>

<small>

Restaurant universitaire

</small>

</div>

</div>

</div>


<!-- PANNEAU ETUDIANT -->

<div
id="ticket-panel"

style="
display:none;
width:100%;
margin-top:25px;
">

<div class="wallet-card">

<h2
id="nom-etudiant">

Étudiant

</h2>

<p
class="wallet-subtitle">

Choisissez le nombre
de tickets à prendre

</p>


<div

style="
display:flex;
flex-direction:column;
align-items:center;
gap:15px;
padding:20px;
border-radius:20px;
background:#f7f7f7;
margin-top:20px;
">

<strong
style="
font-size:25px;
">

Déjeuner

</strong>


<div

style="
display:flex;
align-items:center;
gap:25px;
">

<button

onclick="moinsTicket()"

style="
width:50px;
height:50px;
border:none;
border-radius:50%;
background:#e8e8e8;
font-size:30px;
">

−

</button>


<span

id="nombre-ticket"

style="
font-size:30px;
font-weight:bold;
min-width:30px;
text-align:center;
">

1

</span>


<button

onclick="plusTicket()"

style="
width:50px;
height:50px;
border:none;
border-radius:50%;
background:#7b4dff;
color:white;
font-size:30px;
">

+

</button>

</div>

</div>


<button

onclick="validerTicket()"

style="
width:100%;
margin-top:20px;
padding:15px;
border:none;
border-radius:18px;
background:#7b4dff;
color:white;
font-weight:bold;
font-size:18px;
">

Valider

</button>

</div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="script.js"></script>


<script>

let scanBloque=false;

let html5QrCode=
new Html5Qrcode(
"reader"
);

let nombreTicket=1;

let etudiantActuel=null;



function plusTicket(){

nombreTicket++;

document.getElementById(
"nombre-ticket"
)

innerHTML=

nombreTicket;

}



function moinsTicket(){

if(
nombreTicket<=1
)return;

nombreTicket--;

document.getElementById(
"nombre-ticket"
)

.innerHTML=

nombreTicket;

}



function validerTicket(){

alert(

etudiantActuel.nom

+

"\nTickets : "

+

nombreTicket

);

scanBloque=false;

}



function onScanSuccess(
decodedText
){

if(scanBloque)return;

scanBloque=true;

try{

let data=
JSON.parse(
decodedText
);


chercherEtudiant(

data.carte,

function(etudiant){

etudiantActuel=
etudiant;


html5QrCode.stop();


document.getElementById(
"reader"
)

.style.display=

"none";


document.getElementById(
"scan-zone"
)

.style.display=

"none";


document.getElementById(
"nom-etudiant"
)

.innerHTML=

etudiant.nom;


document.getElementById(
"ticket-panel"
)

.style.display=

"block";


document.getElementById(
"ticket-panel"
)

.scrollIntoView({

behavior:"smooth",
block:"center"

});

}

);

}

catch{

alert(
"QR invalide"
);

scanBloque=false;

}

}


Html5Qrcode
.getCameras()

.then(devices=>{

if(
devices &&
devices.length
){

html5QrCode.start(

{
facingMode:
"environment"
},

{
fps:10,
qrbox:250
},

onScanSuccess

);

}

});

</script>

</body>
</html>
