<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>

Historique Restaurant

</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f2f3f8;
}

.page{

width:100%;
max-width:1000px;

margin:auto;

padding:20px;

}

/* cartes */

.card{

background:white;

padding:18px;

border-radius:22px;

margin-bottom:20px;

}

/* recherche */

.search{

width:100%;
height:55px;

border:none;
outline:none;

padding:0 20px;

background:#f7f7fb;

border-radius:18px;

font-size:16px;

}

/* statistiques */

#stats{

display:flex;

gap:12px;

margin:20px 0;

}

.stat-card{

flex:1;

background:white;

padding:18px;

border-radius:20px;

text-align:center;

}

.stat-card strong{

display:block;

font-size:25px;

margin-top:5px;

}

/* barres */

.mini-bar{

height:14px;

background:#ececec;

border-radius:5px;

margin-top:15px;

overflow:hidden;

}

.mini-fill{

height:100%;

width:0;

background:
linear-gradient(
90deg,
#6f43ff,
#8a68ff
);

transition:.6s;

}

/* total */

.total-card{

background:white;

padding:20px;

border-radius:22px;

text-align:center;

margin-bottom:20px;

}

.total-card span{

display:block;

font-size:35px;

font-weight:bold;

margin:10px 0;

}

/* PDF */

.pdf-btn{

display:block;

margin:auto;

padding:14px 25px;

border:none;

border-radius:18px;

background:white;

font-weight:bold;

color:#007aff;

margin-bottom:20px;

}

/* filtres */

.filtres{

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

margin-bottom:20px;

}

.filtre{

padding:12px 20px;

border-radius:20px;

background:#eee;

cursor:pointer;

}

.active{

background:#7c4dff;

color:white;

}

/* historique */

#historique{

width:100%;

}

.item{

background:white;

padding:18px;

border-radius:18px;

margin-bottom:10px;

display:flex;

justify-content:space-between;

align-items:center;

}

/* mobile */

@media(max-width:700px){

#stats{

flex-direction:column;

}

}

</style>

</head>

<body>

<div class="page">

<!-- RECHERCHE -->

<div class="card">

<input
id="search"
class="search"
placeholder="Rechercher étudiant...">

</div>


<!-- STATS -->

<div id="stats">

<div class="stat-card">

Petit déjeuner

<strong id="stat-petit">
0
</strong>

<div class="mini-bar">

<div
id="bar-petit"
class="mini-fill">

</div>

</div>

</div>



<div class="stat-card">

Déjeuner

<strong id="stat-dej">
0
</strong>

<div class="mini-bar">

<div
id="bar-dej"
class="mini-fill">

</div>

</div>

</div>



<div class="stat-card">

Dîner

<strong id="stat-diner">
0
</strong>

<div class="mini-bar">

<div
id="bar-diner"
class="mini-fill">

</div>

</div>

</div>

</div>


<!-- TOTAL -->

<div class="total-card">

<strong>

Total aujourd'hui

</strong>

<span id="stat-total">

0

</span>

Tickets contrôlés

</div>


<!-- PDF -->

<button
onclick="exportPDF()"
class="pdf-btn">

Exporter PDF

</button>


<!-- FILTRES -->

<div class="filtres">

<div
class="filtre active"
onclick="changerFiltre('all',this)">

Tout

</div>

<div
class="filtre"
onclick="changerFiltre('Petit déjeuner',this)">

Petit déjeuner

</div>

<div
class="filtre"
onclick="changerFiltre('Déjeuner',this)">

Déjeuner

</div>

<div
class="filtre"
onclick="changerFiltre('Dîner',this)">

Dîner

</div>

</div>


<!-- HISTORIQUE -->

<div id="historique">

Chargement...

</div>

</div>

<script>

const firebaseConfig={

apiKey:"AIzaSyCrdqwoG_K39s7_mWCeLprvnUDIBGqcfUY",

authDomain:
"smart-campus-58151.firebaseapp.com",

projectId:
"smart-campus-58151",

messagingSenderId:
"631084577067",

appId:
"1:631084577067:web:bb690c895fc96411dc556e"

};

if(
!firebase.apps.length
){

firebase.initializeApp(
firebaseConfig
);

}

const db=
firebase.firestore();

let user=
JSON.parse(
localStorage.getItem(
"user"
));

let filtreActuel=
"all";

let rechercheActuelle="";

document
.getElementById(
"search"
)

.addEventListener(
"input",
(e)=>{

rechercheActuelle=

e.target.value
.toLowerCase()
.trim();

chargerHistorique();

});

function exportPDF(){

const{
jsPDF
}=window.jspdf;

let pdf=
new jsPDF();

pdf.text(

"Rapport contrôleur restaurant",

20,
20

);

pdf.text(

"Petit déjeuner : "+
document
.getElementById(
"stat-petit"
)
.innerText,

20,
40

);

pdf.text(

"Déjeuner : "+
document
.getElementById(
"stat-dej"
)
.innerText,

20,
50

);

pdf.text(

"Dîner : "+
document
.getElementById(
"stat-diner"
)
.innerText,

20,
60

);

pdf.text(

"Total tickets contrôlés : "+
document
.getElementById(
"stat-total"
)
.innerText,

20,
80

);

pdf.save(
"rapport-restaurant.pdf"
);

}


function changerFiltre(
filtre,
btn
){

filtreActuel=
filtre;

document
.querySelectorAll(
".filtre"
)
.forEach(e=>{

e.classList.remove(
"active"

);

});

btn.classList.add(
"active"
);

chargerHistorique();

}


function chargerHistorique(){

let zone=
document.getElementById(
"historique"
);

db.collection(
"restaurantHistorique"
)

.where(
"controleurId",
"==",
"CTRL001"
)

.orderBy(
"date",
"desc"
)

.onSnapshot((snapshot)=>{

zone.innerHTML="";

let totalPetit=0;
let totalDej=0;
let totalDiner=0;

if(
snapshot.empty
){

zone.innerHTML=`

<div class="card">

Aucun historique

</div>

`;

return;

}

let dernierGroupe="";

snapshot.forEach((doc)=>{

let h=
doc.data();


/* statistiques aujourd'hui */

let dateScan=
new Date(
h.date
);

let aujourdHui=
new Date();

if(

dateScan.toDateString()

===

aujourdHui.toDateString()

){

if(
h.repas==="Petit déjeuner"
){

totalPetit+=
h.quantite;

}

else if(
h.repas==="Déjeuner"
){

totalDej+=
h.quantite;

}

else{

totalDiner+=
h.quantite;

}

}


/* recherche */

if(

rechercheActuelle!=="" &&

!h.nom
.toLowerCase()
.includes(
rechercheActuelle
)

){

return;

}


/* filtre repas */

if(

filtreActuel!=="all"

&&

h.repas!==filtreActuel

){

return;

}


/* regroupement */

let groupe="";

if(

dateScan.toDateString()

===

aujourdHui.toDateString()

){

groupe=
"Aujourd'hui";

}

else{

let hier=
new Date();

hier.setDate(
hier.getDate()-1
);

if(

dateScan.toDateString()

===

hier.toDateString()

){

groupe=
"Hier";

}

else{

groupe=

dateScan.toLocaleDateString(
"fr-FR",
{

day:"numeric",
month:"long"

}

);

}

}


/* titre groupe */

if(
groupe!==dernierGroupe
){

zone.innerHTML+=`

<div
style="
margin:25px 0 10px;
font-weight:bold;
opacity:.6;
">

${groupe}

</div>

`;

dernierGroupe=
groupe;

}


/* heure */

let heure=

dateScan
.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);


/* carte */

zone.innerHTML+=`

<div class="item">

<div>

<strong>

${h.nom}

</strong>

<br>

${h.repas}
×
${h.quantite}

</div>

<div>

${heure}

</div>

</div>

`;

});


/* stats */

document
.getElementById(
"stat-petit"
)
.innerText=
totalPetit;

document
.getElementById(
"stat-dej"
)
.innerText=
totalDej;

document
.getElementById(
"stat-diner"
)
.innerText=
totalDiner;

let totalJour=

totalPetit+
totalDej+
totalDiner;

let max=

Math.max(
totalPetit,
totalDej,
totalDiner,
1
);

document
.getElementById(
"bar-petit"
)

.style.width=

(totalPetit/max*100)
+"%";


document
.getElementById(
"bar-dej"
)

.style.width=

(totalDej/max*100)
+"%";


document
.getElementById(
"bar-diner"
)

.style.width=

(totalDiner/max*100)
+"%";

document
.getElementById(
"stat-total"
)

.innerText=
totalJour;

});

}

chargerHistorique();

</script>
