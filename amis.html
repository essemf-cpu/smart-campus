<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        Amis

    </title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- ICONS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="mobile-container">

    <!-- HEADER -->
    <div class="dashboard-header">

        <div>

            <p class="hello-title">

                Réseau étudiant

            </p>

            <h1>

                Mes amis 👥

            </h1>

        </div>

        <div class="header-profile">

            <i class="fa-solid fa-user-group"></i>

        </div>

    </div>

    <!-- SEARCH -->
    <div class="modern-search">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input type="text"
               id="friend-search"
               placeholder="Rechercher un ami...">

    </div>

    <!-- ADD -->
<div class="modern-search">

    <i class="fa-solid fa-id-card"></i>

    <input type="text"
           id="friendCarte"
           placeholder="Entrer une carte étudiant">

</div>

<button class="add-friend-button"
onclick="ajouterAmi()">

    <i class="fa-solid fa-user-plus"></i>

    Ajouter un ami

</button>


    <!-- TITLE -->
    <div class="section-header">

        <h2>

            Liste d’amis

        </h2>

    </div>

    <!-- LISTE -->
    <div id="liste-amis"></div>

</div>

<!-- NAVBAR -->
<nav class="ios-navbar">

    <a href="dashboard.html">

        <i class="fa-solid fa-house"></i>

    </a>

 <a href="notifications.html"
   class="nav-bell">

    <i class="fa-solid fa-bell"></i>

    <div id="notification-badge"
         class="notification-badge">

    </div>

</a>

    <a
href="profile.html"
class="nav-avatar-link">

<img
id="navAvatar"
class="nav-avatar"
src="">

</a>

</nav>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

<!-- SCRIPT -->
<script src="script.js"></script>

<script>

verifierConnexion("etudiant");

let user=

JSON.parse(
localStorage.getItem(
"user"
)
);

if(user){

db.collection("users")

.where(
"carte",
"==",
user.carte
)

.get()

.then((snapshot)=>{

if(snapshot.empty)return;

let newUser=

snapshot.docs[0].data();

/* synchro locale */

localStorage.setItem(

"user",

JSON.stringify(
newUser
)

/* recharge avatar navbar */

);

afficherAvatar();

/* charge amis */

afficherAmis();

});

}


/* BADGE */

afficherBadgeNotifications();


/* SEARCH */

let searchInput=

document.getElementById(
"friend-search"
);

searchInput.addEventListener(

"keyup",

function(){

let filter=

searchInput.value
.toLowerCase();

let cards=

document.querySelectorAll(
".friend-card"
);

cards.forEach(

function(card){

let text=

card.innerText
.toLowerCase();

if(
text.includes(filter)
){

card.style.display=
"flex";

}else{

card.style.display=
"none";

}

});

});

</script>

</body>
</html>
