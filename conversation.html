<!DOCTYPE html>
<html>

<head>

    <title>Conversation</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- ICONS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="conversation-page">

    <!-- TOPBAR -->
    <div class="chat-topbar">

        <!-- LEFT -->
        <div class="chat-left">

            <a href="messages.html">

                <i class="fa-solid fa-arrow-left"></i>

            </a>

            <!-- AVATAR -->
            <div class="chat-avatar">

             <img
             id="friend-avatar"
             class="real-avatar"
             src="assets/default-user.png">

            </div>

            <!-- INFO -->
            <div class="chat-user-info">

                <strong id="friend-name">

                </strong>

                <p id="friend-status">

                ⚫ Hors ligne

                </p>


            </div>

        </div>

        <!-- ACTIONS -->
        <div class="chat-actions">

            <i class="fa-solid fa-phone"></i>

            <i class="fa-solid fa-video"></i>

        </div>

    </div>

    <!-- MESSAGES -->
    <div id="messages-list"
         class="chat-messages">

    </div>

</div>

<!-- INPUT -->
<div class="chat-input-bar">

    <input type="text"
           id="message"
           placeholder="Votre message...">

    <button onclick="envoyerMessagePrive()">

        <i class="fa-solid fa-paper-plane"></i>

    </button>

</div>

<div id="messageMenu"
class="message-menu">

<div class="reaction-bar">

<span onclick="reagirActuel('👍')">👍</span>

<span onclick="reagirActuel('❤️')">❤️</span>

<span onclick="reagirActuel('😂')">😂</span>

<span onclick="reagirActuel('🙏')">🙏</span>

<span onclick="emojiPlus()">

➕

</span>

</div>

<div
id="optionModifier"
class="message-option"
onclick="modifierActuel()">

<i class="fa-solid fa-pen"></i>

Modifier

</div>


<div
class="message-option"
onclick="copierActuel()">

<i class="fa-regular fa-copy"></i>

Copier

</div>


<div
class="message-option"
onclick="transfererActuel()">

<i class="fa-solid fa-share"></i>

Transférer

</div>


<div
id="optionSupprimer"
class="message-option delete-option"
onclick="supprimerActuel()">

<i class="fa-solid fa-trash"></i>

Supprimer

</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

<!-- SCRIPT -->
<script src="script.js"></script>

<script>

verifierConnexion("etudiant");

afficherAvatarAmi();

afficherMessages();

marquerMessagesCommeLus();

afficherNomConversation();

afficherInfosConversation()

afficherStatusAmi();

</script>

</body>
</html>
