<!DOCTYPE html>
<html>

<head>

    <title>Profil</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- ICONS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="mobile-container">

    <!-- PROFILE CARD -->
    <div class="premium-profile-card">

        <div class="profile-avatar-large">

            <i class="fa-solid fa-user"></i>

        </div>

        <h1 id="profile-name">

            Étudiant

        </h1>

        <p id="profile-carte">

            Carte étudiant

        </p>

        <div class="profile-badges">

            <div class="profile-badge">

                Étudiant

            </div>

            <div class="profile-badge purple-badge">

                Smart Campus

            </div>

        </div>

    </div>

    <!-- MENU -->
    <div class="profile-menu-premium">

        <!-- ITEM -->
        <div class="profile-premium-item">

            <div class="profile-item-left">

                <div class="profile-icon blue-bg">

                    <i class="fa-solid fa-building-columns"></i>

                </div>

                <div>

                    <strong>

                        Faculté

                    </strong>

                    <p id="profile-faculte">

                        Information

                    </p>

                </div>

            </div>

            <i class="fa-solid fa-chevron-right"></i>

        </div>

        <!-- ITEM -->
        <div class="profile-premium-item">

            <div class="profile-item-left">

                <div class="profile-icon orange-bg">

                    <i class="fa-solid fa-graduation-cap"></i>

                </div>

                <div>

                    <strong>

                        Niveau

                    </strong>

                    <p id="profile-niveau">

                        Information

                    </p>

                </div>

            </div>

            <i class="fa-solid fa-chevron-right"></i>

        </div>

        <!-- ITEM -->
        <div class="profile-premium-item">

            <div class="profile-item-left">

                <div class="profile-icon green-bg">

                    <i class="fa-solid fa-shield-halved"></i>

                </div>

                <div>

                    <strong>

                        Sécurité

                    </strong>

                    <p>

                        Protection du compte

                    </p>

                </div>

            </div>

            <i class="fa-solid fa-chevron-right"></i>

        </div>

        <!-- ITEM -->
        <div class="profile-premium-item">

            <div class="profile-item-left">

                <div class="profile-icon purple-bg">

                    <i class="fa-solid fa-bell"></i>

                </div>

                <div>

                    <strong>

                        Notifications

                    </strong>

                    <p>

                        Messages et alertes

                    </p>

                </div>

            </div>

            <i class="fa-solid fa-chevron-right"></i>

        </div>

    </div>

    <!-- LOGOUT -->
    <button class="premium-logout-button"
            onclick="logout()">

        <i class="fa-solid fa-right-from-bracket"></i>

        Se déconnecter

    </button>

</div>

<!-- NAVBAR -->
<nav class="ios-navbar">

    <a href="dashboard.html">

        <i class="fa-solid fa-house"></i>

    </a>

    <a href="amis.html">

        <i class="fa-solid fa-user-group"></i>

    </a>

    <a href="messages.html">

        <i class="fa-solid fa-comments"></i>

    </a>

    <a href="gps.html">

        <i class="fa-solid fa-location-dot"></i>

    </a>

    <a href="profile.html">

        <i class="fa-solid fa-user"></i>

    </a>

</nav>

<!-- SCRIPT -->
<script src="script.js"></script>

<script>

verifierConnexion("etudiant");

let user =
JSON.parse(localStorage.getItem("user"));

document.getElementById("profile-name")
.innerHTML = user.nom;

document.getElementById("profile-carte")
.innerHTML = user.carte;

document.getElementById("profile-faculte")
.innerHTML = user.faculte;

document.getElementById("profile-niveau")
.innerHTML = user.niveau;

</script>

</body>
</html>
