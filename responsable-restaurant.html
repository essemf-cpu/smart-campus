*{

);

/* STATS */

.stats{

display:grid;

repeat(4,1fr);

padding:15px;

}

/* CONTROLEURS */

.controleur{

justify-content:space-between;

align-items:center;

padding:15px 0;

border-bottom:
1px solid #eee;

}

.etat{

font-size:14px;

}

.ajout{

width:100%;

height:50px;

border:none;

border-radius:18px;

background:#6f43ff;

color:white;

font-size:16px;

margin-top:15px;

}

@media(max-width:700px){

.stats{

grid-template-columns:
repeat(2,1fr);

}

}

</style>

<h3>

<div id="listeControleurs">

Chargement...

</div>

<div class="card">

<h3>

<br>

Fallou Fall

Amy Sy

19:45

</div>

</div>

<script>

function chargerControleurs(){

let zone=

document.getElementById(
"listeControleurs"
);

db.collection(
"controleurs"
)

.orderBy(
"nom"
)

.onSnapshot(snapshot=>{

zone.innerHTML="";

if(
snapshot.empty
){

zone.innerHTML=

"Aucun contrôleur";

return;

}

let total=0;

snapshot.forEach(doc=>{

let c=
doc.data();

total++;

zone.innerHTML+=`

<div class="controleur">

<div
style="
display:flex;
align-items:center;
gap:10px;
">

<img

src="${
c.avatar ||

'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'
}"

style="
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
">

<div>

<strong>

${c.nom}

</strong>

<br>

<span
style="
font-size:13px;
opacity:.6;
">

${c.carte}

</span>

</div>

</div>

<span class="etat">

${
c.actif
?

"🟢 Actif"

:

"🔴 Hors ligne"
}

</span>

</div>

`;

});


document.querySelector(
".stat strong"
)
.innerText=

total;

});

}

</script>

<script>

chargerControleurs();

</script>
