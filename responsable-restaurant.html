<style>

*{
margin:0;
padding:0;
box-sizing:border-box;

body{

.page{
max-width:1400px;

padding:20px;

/* HEADER */

.header{
background:
linear-gradient(
135deg,
#3b1d91,
#6f43ff
);

color:white;

padding:20px;

border-radius:18px;

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:20px;
}

.header-left{
display:flex;
align-items:center;

.avatar{
width:65px;

.badge{

/* ACTIONS */

.actions{
display:flex;
gap:10px;
margin-bottom:20px;

}

.btn{
padding:12px 18px;

border-radius:12px;

}

/* STATS */

.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:15px;

}

.stat{
background:white;
padding:18px;
border-radius:16px;

}

display:block;

/* GRID */

td{

<script>

function chargerControleurs(){

let zone =
document.getElementById(
"listeControleurs"
);

db.collection("users")

.where(
"role",
"==",
"controleurRestaurant"
)

.orderBy("nom")

.onSnapshot(async(snapshot)=>{

console.log(
"Contrôleurs trouvés :",
snapshot.size
);

zone.innerHTML="";

if(snapshot.empty){

zone.innerHTML=
"Aucun contrôleur";

return;

}

let total=0;

for(const doc of snapshot.docs){

console.log(
"Controleur :",
doc.data()
);

let c = doc.data();

total++;

/* STATUS */

console.log(
"Recherche status pour :",
c.carte
);

let statusDoc =

await db
.collection("status")
.doc(c.carte)
.get();

let online=false;

let last="Aucune activité";

if(statusDoc.exists){

let s =
statusDoc.data();

online =
s.online;

if(s.lastActive){

let date =
new Date(
s.lastActive
);

last =
date.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}

}

/* HISTORIQUE */

let historiqueSnapshot =

await db
.collection(
"restaurantHistorique"
)
.where(
"controleurId",
"==",
c.carte
)
.get();

let totalTickets =
historiqueSnapshot.size;


/* AFFICHAGE */

/* AFFICHAGE */

zone.innerHTML += `

<tr>

<td>

<div style="
display:flex;
align-items:center;
gap:10px;
">

<img
src="${
c.avatar ||
'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'
}"

style="
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
">

<div>

<strong>
${c.nom}
</strong>

<br>

<span style="
font-size:13px;
opacity:.6;
">

${c.carte}

</span>

</div>

</div>

</td>

<td>

🎫 ${totalTickets}

</td>

<td>

🕒 ${last}

</td>

<td>

<span class="${
online
?
'status-online'
:
'status-offline'
}">

${
online
?
'🟢 En ligne'
:
'⚫ Hors ligne'
}

</span>

</td>

</tr>

`;

}

/* TOTAL */

document.querySelector(
".stat strong"
).innerText=

total;

});

}

chargerControleurs();

function chargerActivites(){

let zone =
document.getElementById(
"activites"
);

db.collection(
"restaurantHistorique"
)

.orderBy(
"date",
"desc"
)

.limit(5)

.onSnapshot(snapshot=>{

zone.innerHTML="";

if(snapshot.empty){

zone.innerHTML=
"Aucune activité";

return;

}

snapshot.forEach(doc=>{

let h =
doc.data();

let heure =

new Date(h.date)

.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

zone.innerHTML+=`

<div
style="
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #eee;
">

<div>

<strong>

${h.nom}

</strong>

<br>

<span style="
font-size:13px;
opacity:.6;
">

${h.repas}

</span>

</div>

<div>

${heure}

</div>

</div>

`;

});

});

}

chargerActivites();

async function chargerGraphique(){

let petit=0;
let dej=0;
let diner=0;

let snapshot =

await db
.collection(
"restaurantHistorique"
)
.get();

snapshot.forEach(doc=>{

let h = doc.data();

if(
h.repas==="Petit déjeuner"
){

petit++;

}

else if(
h.repas==="Déjeuner"
){

dej++;

}

else if(
h.repas==="Dîner"
){

diner++;

}

});

const ctx =

document
.getElementById(
"graphRepas"
)
.getContext("2d");

new Chart(ctx,{

type:"doughnut",

data:{

labels:[
"Petit déjeuner",
"Déjeuner",
"Dîner"
],

datasets:[{

data:[
petit,
dej,
diner
],

backgroundColor:[
"#6f43ff",
"#4caf50",
"#ff9800"
]

}]

},

options:{

responsive:true,

plugins:{

legend:{
position:"bottom"
}

}

}

});

}

chargerGraphique();

</script>
