<script>

let controleurs = [];
let statusMap = {};

function chargerControleurs(){

db.collection("users")

.where(
"role",
"==",
"controleurRestaurant"
)

.orderBy("nom")

.onSnapshot(async(snapshot)=>{

controleurs=[];

for(const doc of snapshot.docs){

let c = doc.data();

let historiqueSnapshot =

await db
.collection(
"restaurantHistorique"
)
.where(
"controleurId",
"==",
c.carte
)
.get();

c.totalTickets =
historiqueSnapshot.size;

controleurs.push(c);

}

afficherControleurs();

});

}

function ecouterStatus(){

db.collection("status")

.onSnapshot(snapshot=>{

statusMap={};

snapshot.forEach(doc=>{

statusMap[
doc.id
]=doc.data();

});

afficherControleurs();

});

}

function afficherControleurs(){

let zone =
document.getElementById(
"listeControleurs"
);

let html="";

let total=0;
let actifs=0;

for(const c of controleurs){

total++;

let online=false;

let last=
"Aucune activité";

let s =
statusMap[c.carte];

if(
s &&
s.lastActive
){

let date =
new Date(
s.lastActive
);

let maintenantDate =
new Date();

if(
date.toDateString()
===
maintenantDate.toDateString()
){

last=
"Aujourd'hui "
+
date.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}
else{

let hier=
new Date();

hier.setDate(
hier.getDate()-1
);

if(
date.toDateString()
===
hier.toDateString()
){

last=
"Hier "
+
date.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}
else{

last=
date.toLocaleDateString(
"fr-FR"
)
+
" "
+
date.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}

}

let diffMinutes=

(
Date.now()
-
s.lastActive
)

/
60000;

online=

s.online===true
&&
diffMinutes<3;

}

if(online){

actifs++;

}

html+=`

<tr>

<td>

<div style="
display:flex;
align-items:center;
gap:10px;
">

<img
src="${
c.avatar ||
'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'
}"

style="
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
">

<div>

<strong>
${c.nom}
</strong>

<br>

<span style="
font-size:13px;
opacity:.6;
">

${c.carte}

</span>

</div>

</div>

</td>

<td>

🎫 ${c.totalTickets}

</td>

<td>

🕒 ${last}

</td>

<td>

<span class="${
online
?
'status-online'
:
'status-offline'
}">

${
online
?
'🟢 En ligne'
:
'⚫ Hors ligne'
}

</span>

</td>

</tr>

`;

}

zone.innerHTML=html;

document.getElementById(
"totalControleurs"
).innerText=
total;

document.getElementById(
"controleursActifs"
).innerText=
actifs;

}

chargerControleurs();
ecouterStatus();

function chargerActivites(){

let zone =
document.getElementById(
"activites"
);

db.collection(
"restaurantHistorique"
)

.orderBy(
"date",
"desc"
)

.limit(5)

.onSnapshot(snapshot=>{

zone.innerHTML="";

if(snapshot.empty){

zone.innerHTML=
"Aucune activité";

return;

}

snapshot.forEach(doc=>{

let h =
doc.data();

let heure =

new Date(h.date)

.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

zone.innerHTML+=`

<div
style="
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #eee;
">

<div>

<strong>

${h.nom}

</strong>

<br>

<span style="
font-size:13px;
opacity:.6;
">

${h.repas}

</span>

</div>

<div>

${heure}

</div>

</div>

`;

});

});

}

chargerActivites();

async function chargerGraphique(){

let petit=0;
let dej=0;
let diner=0;

let snapshot =

await db
.collection(
"restaurantHistorique"
)
.get();

snapshot.forEach(doc=>{

let h = doc.data();

if(
h.repas==="Petit déjeuner"
){

petit++;

}

else if(
h.repas==="Déjeuner"
){

dej++;

}

else if(
h.repas==="Dîner"
){

diner++;

}

});

const ctx =

document
.getElementById(
"graphRepas"
)
.getContext("2d");

new Chart(ctx,{

type:"doughnut",

data:{

labels:[
"Petit déjeuner",
"Déjeuner",
"Dîner"
],

datasets:[{

data:[
petit,
dej,
diner
],

backgroundColor:[
"#6f43ff",
"#4caf50",
"#ff9800"
]

}]

},

options:{

responsive:true,

plugins:{

legend:{
position:"bottom"
}

}

}

});

}

chargerGraphique();

async function chargerStatsJour(){

let petit = 0;
let dej = 0;
let diner = 0;

let aujourdHui =
new Date().toDateString();

let snapshot =
await db
.collection("restaurantHistorique")
.get();

snapshot.forEach(doc=>{

let h = doc.data();

let dateScan =
new Date(h.date);

if(
dateScan.toDateString()
!== aujourdHui
){
return;
}

if(
h.repas==="Petit déjeuner"
){
petit += h.quantite || 1;
}

else if(
h.repas==="Déjeuner"
){
dej += h.quantite || 1;
}

else if(
h.repas==="Dîner"
){
diner += h.quantite || 1;
}

});

document.getElementById(
"petitDej"
).innerText = petit;

document.getElementById(
"dejeuner"
).innerText = dej;

document.getElementById(
"diner"
).innerText = diner;

document.getElementById(
"ticketsJour"
).innerText =
petit + dej + diner;

}

chargerStatsJour();

function deconnexion(){

localStorage.removeItem(
"user"
);

window.location.href=
"index.html";

}
