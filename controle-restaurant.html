<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Contrôle Restaurant
</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<!-- QR SCANNER -->
    <script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{

margin:0;

padding:0;

font-family:Arial,sans-serif;

background:#f2f3f8;

}

.page{

padding:20px;

}

.top-card{

background:
linear-gradient(
135deg,
#6f43ff,
#8a68ff
);

color:white;

padding:20px;

border-radius:25px;

margin-bottom:20px;

}

.top-card h2{

margin:0;

}

.top-card p{

margin-top:5px;

opacity:.9;

}

.section{

background:white;

padding:20px;

border-radius:25px;

margin-bottom:20px;

box-shadow:
0 6px 20px rgba(0,0,0,.08);

}

.tickets{

display:flex;

gap:10px;

}

.ticket{

flex:1;

padding:15px;

border:none;

border-radius:18px;

background:#eee;

font-weight:bold;

}

.ticket.active{

background:#7c4dff;

color:white;

}

.scan-zone{

height:180px;

border-radius:20px;

border:3px dashed #7c4dff;

display:flex;

justify-content:center;

align-items:center;

font-size:20px;

color:#7c4dff;

}

.etudiant{

display:none;

}

.compteur{

display:flex;

justify-content:center;

align-items:center;

gap:20px;

margin-top:20px;

}

.compteur button{

width:50px;

height:50px;

border:none;

border-radius:50%;

font-size:25px;

background:#7c4dff;

color:white;

}

.nombre{

font-size:30px;

font-weight:bold;

}

.valider{

width:100%;

height:60px;

border:none;

border-radius:20px;

background:
linear-gradient(
135deg,
#6f43ff,
#8a68ff
);

color:white;

font-size:18px;

font-weight:bold;

margin-top:20px;

}

.historique-item{

background:#f7f7fb;

padding:15px;

border-radius:18px;

margin-bottom:12px;

display:flex;

justify-content:space-between;

align-items:center;

}

.historique-left strong{

display:block;

font-size:15px;

}

.historique-left p{

margin-top:5px;

font-size:13px;

opacity:.7;

}

.historique-time{

font-size:12px;

opacity:.6;

}

</style>

</head>

<body>

<div class="page">

<div class="top-card">

<h2 id="controleurNom">

Chargement...

</h2>

<p>

Contrôle restaurant

</p>

</div>

<div class="section">

<div class="tickets">

<button
class="ticket active"
onclick="choisir('Petit déjeuner',this)"
>

Petit déjeuner

</button>

<button
class="ticket"
onclick="choisir('Déjeuner',this)"
>

Déjeuner

</button>

<button
class="ticket"
onclick="choisir('Dîner',this)"
>

Diner

</button>

</div>

</div>

<div class="section">

<h3>

Historique récent

</h3>

<div
id="historique-list"
>

Chargement...

</div>

</div>

<div class="section">

<div
class="scan-zone"
onclick="ouvrirScanner()"
>

📷 Scanner QR

</div>

<div
id="reader"
style="
display:none;
margin-top:20px;
"
>

</div>

</div>

<div
class="section etudiant"
id="etudiantCard"
>

<h3 id="nom">

Amy Sy

</h3>

<div
style="
background:#f8f8ff;
padding:15px;
border-radius:20px;
margin:20px 0;
">

<p>

🍽️ Repas :

<strong id="typeAffichage">

Petit déjeuner

</strong>

</p>

<p>

🎫 Tickets disponibles :

<strong id="ticketNombre">

0

</strong>

</p>

<p>

💰 Prix unitaire :

<strong id="prixRepas">

500 FCFA

</strong>

</p>

</div>

<div class="compteur">

<button
onclick="moins()"
>

-

</button>

<div
class="nombre"
id="nombre"
>

1

</div>

<button
onclick="plus()"
>

+

</button>

</div>

<button
class="valider"
onclick="valider()"
>

Valider

</button>

<button
class="valider"
style="
margin-top:10px;
background:#eee;
color:black;
"
onclick="annulerScan()"
>

Annuler

</button>

</div>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig={

apiKey:"AIzaSyCrdqwoG_K39s7_mWCeLprvnUDIBGqcfUY",

authDomain:
"smart-campus-58151.firebaseapp.com",

projectId:
"smart-campus-58151",

messagingSenderId:
"631084577067",

appId:
"1:631084577067:web:bb690c895fc96411dc556e"

};

if(!firebase.apps.length){

firebase.initializeApp(
firebaseConfig
);

}

const db=
firebase.firestore();


let user=
JSON.parse(
localStorage.getItem(
"user"
));

document.getElementById(
"controleurNom"
).innerHTML=
user.nom;


let nombre=1;
let type="Petit déjeuner";

let html5QrCode=null;
let scanBloque=false;



function choisir(
repas,
btn
){

type=repas;

document
.querySelectorAll(
".ticket"
)
.forEach(e=>{

e.classList.remove(
"active"
);

});

btn.classList.add(
"active"
);


document
.getElementById(
"typeAffichage"
).innerText=
repas;


let prix=1000;

if(
repas==="Petit déjeuner"
){

prix=500;

}

document
.getElementById(
"prixRepas"
)

.innerText=

prix+" FCFA";

}


function plus(){

nombre++;

document
.getElementById(
"nombre"
)
.innerText=
nombre;

}



function moins(){

if(nombre<=1)
return;

nombre--;

document
.getElementById(
"nombre"
)
.innerText=
nombre;

}



function ouvrirScanner(){

document
.querySelector(
".scan-zone"
)
.style.display=
"none";

document
.getElementById(
"reader"
)
.style.display=
"block";


demarrerScanner();

}



function demarrerScanner(){

if(html5QrCode)
return;


html5QrCode=
new Html5Qrcode(
"reader"
);


html5QrCode.start(

{
facingMode:
"environment"
},

{
fps:10,
qrbox:250
},

function(decodedText){

if(scanBloque)
return;

scanBloque=true;


try{

let data=
JSON.parse(
decodedText.trim()
);


if(
!data.carte
){

scanBloque=false;

return;
}


db.collection(
"users"
)

.where(
"carte",
"==",
data.carte
)

.get()

.then(snapshot=>{

if(
snapshot.empty
){

alert(
"Étudiant introuvable"
);

scanBloque=false;

return;

}


let doc=
snapshot.docs[0];

let etudiant=
doc.data();


html5QrCode
.stop()
.then(()=>{

html5QrCode=null;

});


document
.getElementById(
"reader"
)
.style.display=
"none";


document
.getElementById(
"etudiantCard"
)
.style.display=
"block";


document
.getElementById(
"nom"
)
.dataset.carte=
etudiant.carte;


document
.getElementById(
"nom"
)
.innerText=
etudiant.nom;



let ticketsMap={

"Petit déjeuner":
etudiant.ticketPetitDej || 0,

"Déjeuner":
etudiant.ticketDejeuner || 0,

"Dîner":
etudiant.ticketDiner || 0

};

document
.getElementById(
"ticketNombre"
)

.innerText=

ticketsMap[type];

document
.getElementById(
"typeAffichage"
)
.innerText=
type;

let prix=1000;

if(
type==="Petit déjeuner"
){

prix=500;

}

document
.getElementById(
"prixRepas"
)

.innerText=

prix+" FCFA";


scanBloque=false;

});

}

catch(e){

console.log(e);

scanBloque=false;

}

}

);

}



function valider(){

let carte=

document
.getElementById(
"nom"
)
.dataset.carte;


if(!carte){

alert(
"Aucun étudiant"
);

return;

}


db.collection(
"users"
)

.where(
"carte",
"==",
carte
)

.get()

.then(snapshot=>{


let doc=
snapshot.docs[0];

let etudiant=
doc.data();

let champ="";
let prix=1000;


if(
type==="Petit déjeuner"
){

champ=
"ticketPetitDej";

prix=500;

}

else if(
type==="Déjeuner"
){

champ=
"ticketDejeuner";

}

else{

champ=
"ticketDiner";

}


let tickets=
etudiant[
champ
]||0;


let utiliser=

Math.min(
tickets,
nombre
);

let reste=

nombre-
utiliser;

/* si pas assez de tickets */

if(
reste>0
){

let montant=
reste*prix;

let ok=
confirm(

`${tickets} ticket(s) disponible(s)

Il manque ${reste}

Défalquer ${montant} FCFA du solde ?`

);

if(!ok){

return;

}

}

/* calcul */

let nouveauTicket=

tickets-
utiliser;

let nouveauSolde=

(
etudiant.solde||0
)
-
(
reste*prix
);

if(
nouveauSolde<0
){

alert(
"Solde insuffisant"
);

return;

}


if(
nouveauSolde<0
){

let choix=

confirm(

"Tickets insuffisants.\n\nDéfalquer le reste du solde ?"

);

if(
!choix
){

return;
}

}


db.collection(
"users"
)

.doc(
doc.id
)

.update({

[champ]:
nouveauTicket,

solde:
nouveauSolde

})

.then(()=>{


db.collection(
"restaurantHistorique"
)

.add({

nom:
etudiant.nom,

carte:
etudiant.carte,

repas:
type,

quantite:
nombre,

controleur:
user.nom,

date:
Date.now()

});

db.collection(
"restaurantNotifications"
)

.add({

to:etudiant.carte,

type:"restaurant",

title:
"Restaurant universitaire",

text:
`Ticket ${type} validé (${nombre})`,

seen:false,

date:Date.now()

});


alert(
"Ticket validé ✅"
);


/* reset */

nombre=1;

document
.getElementById(
"nombre"
)
.innerText=
1;


document
.getElementById(
"etudiantCard"
)
.style.display=
"none";


document
.querySelector(
".scan-zone"
)
.style.display=
"flex";

});

});

}

function annulerScan(){

document
.getElementById(
"etudiantCard"
)

.style.display=
"none";


document
.getElementById(
"nom"
)

.innerText=
"";

document
.getElementById(
"nom"
)

.dataset.carte=
"";


document
.getElementById(
"ticketNombre"
)

.innerText=
"0";


nombre=1;

document
.getElementById(
"nombre"
)

.innerText=
"1";


document
.querySelector(
".scan-zone"
)

.style.display=
"flex";

}


function chargerHistorique(){

let zone=
document.getElementById(
"historique-list"
);

db.collection(
"restaurantHistorique"
)

.orderBy(
"date",
"desc"
)

.limit(10)

.onSnapshot(snapshot=>{

zone.innerHTML="";

if(snapshot.empty){

zone.innerHTML=
"Aucun historique";

return;
}

snapshot.forEach(doc=>{

let h=
doc.data();

let heure=
new Date(
h.date
)

.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

zone.innerHTML+=`

<div class="historique-item">

<div class="historique-left">

<strong>
${h.nom}
</strong>

<p>

${h.repas}
×
${h.quantite}

</p>

</div>

<div class="historique-time">

${heure}

</div>

</div>

`;

});

});

}

chargerHistorique();

</script>

</body>

</html>
