<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Contrôle Restaurant
</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<style>

body{

margin:0;

padding:0;

font-family:Arial,sans-serif;

background:#f2f3f8;

}

.page{

padding:20px;

}

.top-card{

background:
linear-gradient(
135deg,
#6f43ff,
#8a68ff
);

color:white;

padding:20px;

border-radius:25px;

margin-bottom:20px;

}

.top-card h2{

margin:0;

}

.top-card p{

margin-top:5px;

opacity:.9;

}

.section{

background:white;

padding:20px;

border-radius:25px;

margin-bottom:20px;

box-shadow:
0 6px 20px rgba(0,0,0,.08);

}

.tickets{

display:flex;

gap:10px;

}

.ticket{

flex:1;

padding:15px;

border:none;

border-radius:18px;

background:#eee;

font-weight:bold;

}

.ticket.active{

background:#7c4dff;

color:white;

}

.scan-zone{

height:180px;

border-radius:20px;

border:3px dashed #7c4dff;

display:flex;

justify-content:center;

align-items:center;

font-size:20px;

color:#7c4dff;

}

.etudiant{

display:none;

}

.compteur{

display:flex;

justify-content:center;

align-items:center;

gap:20px;

margin-top:20px;

}

.compteur button{

width:50px;

height:50px;

border:none;

border-radius:50%;

font-size:25px;

background:#7c4dff;

color:white;

}

.nombre{

font-size:30px;

font-weight:bold;

}

.valider{

width:100%;

height:60px;

border:none;

border-radius:20px;

background:
linear-gradient(
135deg,
#6f43ff,
#8a68ff
);

color:white;

font-size:18px;

font-weight:bold;

margin-top:20px;

}

</style>

</head>

<body>

<div class="page">

<div class="top-card">

<h2>

Moussa Contrôleur

</h2>

<p>

Contrôle restaurant

</p>

</div>

<div class="section">

<div class="tickets">

<button
class="ticket active"
onclick="choisir('Petit déjeuner',this)"
>

🍞

</button>

<button
class="ticket"
onclick="choisir('Déjeuner',this)"
>

🍛

</button>

<button
class="ticket"
onclick="choisir('Dîner',this)"
>

🌙

</button>

</div>

</div>

<div class="section">

<div
class="scan-zone"
onclick="simulerScan()"
>

📷 Scanner QR

</div>

</div>

<div
class="section etudiant"
id="etudiantCard"
>

<h3 id="nom">

Amy Sy

</h3>

<p>

Tickets :

<span id="ticketNombre">

3

</span>

</p>

<div class="compteur">

<button
onclick="moins()"
>

-

</button>

<div
class="nombre"
id="nombre"
>

1

</div>

<button
onclick="plus()"
>

+

</button>

</div>

<button
class="valider"
onclick="valider()"
>

Valider

</button>

</div>

</div>

<script>

let nombre=1;

let type=
"Petit déjeuner";

function choisir(
repas,
btn
){

type=repas;

document
.querySelectorAll(
".ticket"
)

.forEach(e=>{

e.classList.remove(
"active"
);

});

btn.classList.add(
"active"
);

}

function simulerScan(){

document
.getElementById(
"etudiantCard"
)

.style.display=
"block";

}

function plus(){

nombre++;

document
.getElementById(
"nombre"
)

.innerText=
nombre;

}

function moins(){

if(
nombre>1
){

nombre--;

document
.getElementById(
"nombre"
)

.innerText=
nombre;

}

}

function valider(){

alert(

type+

"\nNombre : "+

nombre

);

}

</script>

</body>

</html>
