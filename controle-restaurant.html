<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Contrôle Restaurant
</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<!-- QR SCANNER -->
    <script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{

margin:0;

padding:0;

font-family:Arial,sans-serif;

background:#f2f3f8;

}

.page{

padding:20px;

}

.top-card{

background:
linear-gradient(
135deg,
#6f43ff,
#8a68ff
);

color:white;

padding:20px;

border-radius:25px;

margin-bottom:20px;

}

.top-card h2{

margin:0;

}

.top-card p{

margin-top:5px;

opacity:.9;

}

.section{

background:white;

padding:20px;

border-radius:25px;

margin-bottom:20px;

box-shadow:
0 6px 20px rgba(0,0,0,.08);

}

.tickets{

display:flex;

gap:10px;

}

.ticket{

flex:1;

padding:15px;

border:none;

border-radius:18px;

background:#eee;

font-weight:bold;

}

.ticket.active{

background:#7c4dff;

color:white;

}

.scan-zone{

height:180px;

border-radius:20px;

border:3px dashed #7c4dff;

display:flex;

justify-content:center;

align-items:center;

font-size:20px;

color:#7c4dff;

}

.etudiant{

display:none;

}

.compteur{

display:flex;

justify-content:center;

align-items:center;

gap:20px;

margin-top:20px;

}

.compteur button{

width:50px;

height:50px;

border:none;

border-radius:50%;

font-size:25px;

background:#7c4dff;

color:white;

}

.nombre{

font-size:30px;

font-weight:bold;

}

.valider{

width:100%;

height:60px;

border:none;

border-radius:20px;

background:
linear-gradient(
135deg,
#6f43ff,
#8a68ff
);

color:white;

font-size:18px;

font-weight:bold;

margin-top:20px;

}

.historique-item{

background:#f7f7fb;

padding:15px;

border-radius:18px;

margin-bottom:12px;

display:flex;

justify-content:space-between;

align-items:center;

}

.historique-left strong{

display:block;

font-size:15px;

}

.historique-left p{

margin-top:5px;

font-size:13px;

opacity:.7;

}

.historique-time{

font-size:12px;

opacity:.6;

}

</style>

</head>

<body>

<div class="page">

<div class="top-card">

<h2>

Moussa Contrôleur

</h2>

<p>

Contrôle restaurant

</p>

</div>

<div class="section">

<div class="tickets">

<button
class="ticket active"
onclick="choisir('Petit déjeuner',this)"
>

Petit déjeuner

</button>

<button
class="ticket"
onclick="choisir('Déjeuner',this)"
>

Déjeuner

</button>

<button
class="ticket"
onclick="choisir('Dîner',this)"
>

Diner

</button>

</div>

</div>

<div class="section">

<h3>

Historique récent

</h3>

<div
id="historique-list"
>

Chargement...

</div>

</div>

<div class="section">

<div
class="scan-zone"
onclick="ouvrirScanner()"
>

📷 Scanner QR

</div>

<div
id="reader"
style="
display:none;
margin-top:20px;
"
>

</div>

</div>

<div
class="section etudiant"
id="etudiantCard"
>

<h3 id="nom">

Amy Sy

</h3>

<p>

Tickets :

<span id="ticketNombre">

3

</span>

</p>

<div class="compteur">

<button
onclick="moins()"
>

-

</button>

<div
class="nombre"
id="nombre"
>

1

</div>

<button
onclick="plus()"
>

+

</button>

</div>

<button
class="valider"
onclick="valider()"
>

Valider

</button>

</div>

</div>

<script>

let nombre=1;

let type=
"Petit déjeuner";

function choisir(
repas,
btn
){

type=repas;

document
.querySelectorAll(
".ticket"
)

.forEach(e=>{

e.classList.remove(
"active"
);

});

btn.classList.add(
"active"
);

}

function simulerScan(){

let carte=

prompt(
"Carte étudiant"
);

if(!carte)
return;

db.collection(
"users"
)

.where(
"carte",
"==",
carte
)

.get()

.then((snapshot)=>{

if(
snapshot.empty
){

alert(
"Étudiant introuvable"
);

return;

}

let etudiant=

snapshot.docs[0]
.data();

document
.getElementById(
"etudiantCard"
)

.style.display=
"block";

document
.getElementById(
"nom"
)
.dataset.carte=
etudiant.carte

.innerText=

etudiant.nom;

let tickets=0;

if(
type==="Petit déjeuner"
){

tickets=
etudiant.ticketPetitDej||0;

}

if(
type==="Déjeuner"
){

tickets=
etudiant.ticketDejeuner||0;

}

if(
type==="Dîner"
){

tickets=
etudiant.ticketDiner||0;

}

document
.getElementById(
"ticketNombre"
)

.innerText=
tickets;

});

}

function plus(){

nombre++;

document
.getElementById(
"nombre"
)

.innerText=
nombre;

}

function moins(){

if(
nombre>1
){

nombre--;

document
.getElementById(
"nombre"
)

.innerText=
nombre;

}

}

function valider(){

let carte=

document.getElementById(
"nom"
).dataset.carte;

if(!carte){

alert(
"Aucun étudiant"
);

return;

}

db.collection(
"users"
)

.where(
"carte",
"==",
carte
)

.get()

.then((snapshot)=>{

if(snapshot.empty)
return;

let doc=
snapshot.docs[0];

let etudiant=
doc.data();

let tickets=0;

let champ="";

let prix=1000;


/* type repas */

if(
type==="Petit déjeuner"
){

champ=
"ticketPetitDej";

prix=500;

}

if(
type==="Déjeuner"
){

champ=
"ticketDejeuner";

prix=1000;

}

if(
type==="Dîner"
){

champ=
"ticketDiner";

prix=1000;

}

tickets=
etudiant[champ]||0;


/* calcul */

let utiliser=

Math.min(
tickets,
nombre
);

let reste=

nombre-
utiliser;

let nouveauTicket=

tickets-
utiliser;

let nouveauSolde=

(
etudiant.solde||0
)
-
(
reste*prix
);

if(
nouveauSolde<0
){

alert(
"Solde insuffisant"
);

return;

}

/* sauvegarde */

db.collection(
"users"
)

.doc(
doc.id
)

.update({

[champ]:
nouveauTicket,

solde:
nouveauSolde

})

.then(()=>{

    db.collection(
"restaurantHistorique"
)

.add({

nom:
etudiant.nom,

carte:
etudiant.carte,

repas:
type,

quantite:
nombre,

controleur:
JSON.parse(
localStorage.getItem(
"user"
)
).nom,

date:
Date.now()

});

alert(
"Ticket(s) validé ✅"
);

});

});

}

function ouvrirScanner(){

document
.getElementById(
"reader"
)
.style.display=
"block";

const scanner =

new Html5Qrcode(
"reader"
);

scanner.start(

{
facingMode:"environment"
},

{
fps:10,
qrbox:250
},

function(qr){

try{

console.log(qr);

let texte=

qr.trim();

let data=
JSON.parse(
texte
);

chercherEtudiant(
data.carte
);

}

catch(e){

alert(
qr
);

console.log(e);

}

},

function(error){

}

);

}

function chercherEtudiant(
carte
){

db.collection(
"users"
)

.where(
"carte",
"==",
carte
)

.get()

.then((snapshot)=>{

if(
snapshot.empty
){

alert(
"Étudiant introuvable"
);

return;

}

let etudiant=

snapshot.docs[0]
.data();

document
.getElementById(
"etudiantCard"
)

.style.display=
"block";

document
.getElementById(
"nom"
)

.innerText=
etudiant.nom;

document
.getElementById(
"nom"
)

.dataset.carte=
etudiant.carte;

let tickets=0;

if(
type==="Petit déjeuner"
){

tickets=
etudiant.ticketPetitDej||0;

}

if(
type==="Déjeuner"
){

tickets=
etudiant.ticketDejeuner||0;

}

if(
type==="Dîner"
){

tickets=
etudiant.ticketDiner||0;

}

document
.getElementById(
"ticketNombre"
)

.innerText=
tickets;

});

}

function chargerHistorique(){

let zone=

document.getElementById(
"historique-list"
);

if(!zone)
return;

let user=

JSON.parse(
localStorage.getItem(
"user"
));

db.collection(
"restaurantHistorique"
)

.where(
"controleur",
"==",
user.nom
)

.orderBy(
"date",
"desc"
)

.limit(10)

.onSnapshot(
(snapshot)=>{

zone.innerHTML="";

if(
snapshot.empty
){

zone.innerHTML=
"Aucun historique";

return;

}

snapshot.forEach(
(doc)=>{

let h=
doc.data();

let heure=

new Date(
h.date
)

.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

zone.innerHTML+=`

<div
class="historique-item"
>

<div
class="historique-left"
>

<strong>

${h.nom}

</strong>

<p>

${h.repas}
×${h.quantite}

</p>

</div>

<div
class="historique-time"
>

${heure}

</div>

</div>

`;

});

});

}

chargerHistorique();

</script>

</body>

</html>
