<!DOCTYPE html>
<html>

<head>

    <title>Smart Campus</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="mobile-container">

    <!-- HEADER -->
    <div class="dashboard-header">

        <div>

            <p class="hello-title">

                Bonjour 👋

            </p>

            <h1 id="nom-user"></h1>

        </div>

        <div class="header-profile">

         <img
          class="profile-avatar"
          style="display:none;">

        </div>

    </div>

    <!-- SEARCH -->
    <div class="modern-search">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input type="text"
               placeholder="Rechercher un service...">

    </div>

    <!-- SERVICES -->
    <div class="premium-grid">

        <a href="guide.html"
           class="premium-card">

            <i class="fa-solid fa-book"></i>

            <span>Guide</span>

        </a>

        <a href="restauration.html"
           class="premium-card">

            <i class="fa-solid fa-utensils"></i>

            <span>Restaurant</span>

        </a>

        <a href="gps.html"
           class="premium-card">

            <i class="fa-solid fa-location-dot"></i>

            <span>GPS</span>

        </a>

        <a href="amis.html"
           class="premium-card">

            <i class="fa-solid fa-user-group"></i>

            <span>Amis</span>

        </a>

        <a href="messages.html"
           class="premium-card nav-icon">

            <i class="fa-solid fa-comments"></i>

            <span>Messages</span>

            <div
            id="message-badge"
            style="display:none;">

            </div>

        </a>

        <!-- CODIFIER -->
        <a href="codifier.html"
        class="premium-card">

        <i class="fa-solid fa-id-badge"></i>

        <span>Codifier</span>

        </a>

    </div>


    <!-- QR -->
    <div class="wallet-card">

        <h2>

            Mon QR Code étudiant

        </h2>

        <p class="wallet-subtitle">

            Présentez ce code
            pour vos accès campus.

        </p>

        <div class="wallet-qr">

            <div id="qrcode"></div>

        </div>

        <button class="scan-button"
        onclick="window.location.href='scanner.html'">

            <i class="fa-solid fa-camera"></i>

            Scanner un QR Code

        </button>

    </div>

    <!-- HISTORIQUE -->
    <div class="history-section">

        <h3>

            Historique

        </h3>

        <!-- BIBLIOTHEQUE -->
        <a href="bibliotheque.html"
           class="history-card">

            <div class="history-icon purple-bg">

                <i class="fa-solid fa-book"></i>

            </div>

            <div class="history-info">

                <strong>

                    Bibliothèque

                </strong>

                <small>

                    Votre univers de livres disponible

                </small>

            </div>

            <i class="fa-solid fa-chevron-right"></i>

        </a>

    </div>

        <!-- PLANNING -->
        <a href="planning.html"
           class="history-card">

            <div class="history-icon purple-icon">

                <i class="fa-solid fa-calendar-days"></i>

            </div>

            <div class="history-info">

                <strong>

                    Planning

                </strong>

                <small>

                    Visualisez votre planning

                </small>

            </div>

            <i class="fa-solid fa-chevron-right"></i>

        </a>


</div>

<!-- NAVBAR -->
<nav class="ios-navbar">

    <!-- HOME -->
    <a href="dashboard.html">

        <i class="fa-solid fa-house"></i>

    </a>

    <!-- NOTIFICATIONS -->
    <a href="notifications.html"
   class="nav-bell">

    <i class="fa-solid fa-bell"></i>

    <div id="notification-badge"
         class="notification-badge">

    </div>

</a>

    <!-- PROFILE -->
    <a href="profile.html">

        <i class="fa-solid fa-user"></i>

    </a>

</nav>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

<!-- QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<!-- SCRIPT -->
<script src="script.js"></script>

<script>

verifierConnexion("etudiant");

/* USER */

let user =
JSON.parse(
localStorage.getItem(
"user"
)
);

if(user){

/* NOM */

document.getElementById(
"nom-user"
).textContent =
user.nom;


/* AVATAR */

let avatar =
document.querySelector(
".profile-avatar"
);

if(
avatar &&
user.avatar
){

avatar.src =
user.avatar;

avatar.style.display =
"block";

}

}


/* QR */

genererQR();

/* BADGES */

afficherBadgeMessages();

afficherBadgeNotifications();

</script>

</body>
</html>
