<!DOCTYPE html>
<html>

<head>

    <title>Smart Campus</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


</head>

<body>

<div class="app-container">

    <!-- HEADER -->
    <div class="top-header">

        <div>

            <p class="hello-text">
                Bonjour 👋
            </p>

            <h1 id="nom-user"></h1>

        </div>

        <div class="profile-circle">

            <i class="fa-solid fa-user"></i>

        </div>

    </div>

    <!-- SEARCH -->
    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            placeholder="Rechercher un service..."
        >

    </div>

    <!-- SERVICES -->
    <div class="services-grid">

        <a href="guide.html" class="service-card purple">
            <i class="fa-solid fa-book"></i>
            <span>Guide</span>
        </a>

        <a href="maintenance.html" class="service-card blue">
            <i class="fa-solid fa-screwdriver-wrench"></i>
            <span>Maintenance</span>
        </a>

        <a href="restauration.html" class="service-card orange">
            <i class="fa-solid fa-utensils"></i>
            <span>Restauration</span>
        </a>

        <a href="gps.html" class="service-card red">
            <i class="fa-solid fa-location-dot"></i>
            <span>GPS</span>
        </a>

        <a href="amis.html" class="service-card pink">
            <i class="fa-solid fa-user-group"></i>
            <span>Amis</span>
        </a>

        <a href="messages.html" class="service-card cyan">
            <i class="fa-solid fa-comments"></i>
            <span>Messages</span>
        </a>

    </div>

    <!-- BANNER -->
    <div class="welcome-banner">

        <div>

            <h2>Bienvenue sur Smart Campus 🎓</h2>

            <p>
                Votre vie étudiante simplifiée.
            </p>

        </div>

    </div>

    <!-- QR -->
    <div class="qr-card">

        <h2>Mon QR Code</h2>

        <div id="qrcode"></div>

    </div>

</div>

<!-- NAVBAR -->
<nav class="bottom-nav">

    <a href="dashboard.html">
        <i class="fa-solid fa-house"></i>
    </a>

    <a href="amis.html">
        <i class="fa-solid fa-user-group"></i>
    </a>

    <a href="messages.html"
   class="nav-icon">

    <i class="fa-solid fa-comments"></i>

    <span id="message-badge">

        0

    </span>

    </a>

    <a href="gps.html">
        <i class="fa-solid fa-location-dot"></i>
    </a>

    <a href="profile.html">
        <i class="fa-solid fa-user"></i>
    </a>

</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script src="script.js"></script>

<script>

verifierConnexion("etudiant");

chargerTheme();
afficherBadgeMessages();

let user =
JSON.parse(localStorage.getItem("user"));

document.getElementById("nom-user")
.innerHTML = user.nom;

genererQR();

</script>

</body>

</html>
