<!DOCTYPE html>
<html>

<head>

    <title>Messages</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- ICONS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="mobile-container">

    <a
href="archives.html">

📦 Archives

</a>

    <!-- HEADER -->
    <div class="messages-header">

        <div>

            <p class="hello-title">

                Discussions privées

            </p>

            <h1>

                Messages 💬

            </h1>

        </div>

        <div class="header-profile">

            <i class="fa-solid fa-comments"></i>

        </div>

    </div>

    <!-- SEARCH -->
    <div class="modern-search">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input type="text"
               placeholder="Rechercher une discussion">

    </div>

    <!-- LIST -->
    <div id="conversations-list"
         class="conversation-list">

    </div>

</div>

<div
id="conversationMenu"
class="message-menu">

<div
class="message-option"
onclick="epinglerConversation()">

<i class="fa-solid fa-thumbtack"></i>

Épingler

</div>

<div
class="message-option"
onclick="archiverConversation()">

<i class="fa-solid fa-box-archive"></i>

Archiver

</div>

<div
class="message-option delete-option"
onclick="supprimerConversation()">

<i class="fa-solid fa-trash"></i>

Supprimer

</div>

</div>

<!-- NAVBAR -->
<nav class="ios-navbar">

    <!-- HOME -->
    <a href="dashboard.html">

        <i class="fa-solid fa-house"></i>

    </a>

    <!-- NOTIFICATIONS -->
    <a href="notifications.html"
   class="nav-bell">

    <i class="fa-solid fa-bell"></i>

    <div id="notification-badge"
         class="notification-badge">

    </div>

</a>

    <!-- PROFILE -->
    <a
href="profile.html"
class="nav-avatar-link">

<img
id="navAvatar"
class="nav-avatar"
src="">

</a>

</nav>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

<!-- SCRIPT -->
<script src="script.js"></script>

<script>

document.addEventListener(

"DOMContentLoaded",

function(){

afficherArchives();

}

);

</script>

<script>

verifierConnexion("etudiant");

afficherConversations();

afficherBadgeMessages();

afficherBadgeNotifications();

</script>

</body>
</html>
