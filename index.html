<!DOCTYPE html>
<html>

<head>

    <title>Smart Campus</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- ICONS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- PWA -->
    <link rel="manifest"
          href="manifest.json">

</head>

<body class="auth-body">

<div class="auth-container">

    <!-- TOP -->
    <div class="auth-top">

        <img src="logo coud.png"
             class="auth-logo">

        <h1>

            Smart Campus

        </h1>

        <p>

            Votre expérience universitaire,
            modernisée.

        </p>

    </div>

    <!-- LOGIN CARD -->
    <div class="auth-card">

        <h2>

            Connexion

        </h2>

        <!-- INPUT -->
        <div class="input-box">

            <i class="fa-solid fa-id-card"></i>

            <input type="text"
                   id="username"
                   placeholder="Numéro carte étudiant">

        </div>

        <!-- INPUT -->
        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input type="password"
                   id="password"
                   placeholder="Mot de passe">

        </div>

        <!-- BUTTON -->
        <button class="auth-button"
                onclick="login()">

            Se connecter

        </button>

        <!-- LINKS -->
        <div class="auth-links">

            <a href="inscription.html">

                Créer un compte

            </a>

        </div>

    </div>

    </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- SCRIPT -->
<script src="script.js"></script>

</body>
</html>
