<!DOCTYPE html>
<html>

<head>

    <title>Codifier</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="mobile-container">

    <!-- HEADER -->
    <div class="guide-header">

        <a href="dashboard.html">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <h1>

            Codification

        </h1>

    </div>

    <!-- CARD -->
    <div class="wallet-card">

        <h2>

            Demande de codification

        </h2>

        <p class="wallet-subtitle">

            Effectuez votre demande
            de logement universitaire.

        </p>

        <button class="scan-button">

            <i class="fa-solid fa-paper-plane"></i>

            Faire une demande

        </button>

    </div>

    <!-- STATUS -->
    <div class="history-section">

        <h3>

            Statut actuel

        </h3>

        <div class="history-card">

            <div class="history-icon purple-bg">

                <i class="fa-solid fa-hourglass-half"></i>

            </div>

            <div class="history-info">

                <strong>

                    Service Fermé

                </strong>

                <small>

                    Aucun dossier n'est encore pris en charge

                </small>

            </div>

        </div>

    </div>

</div>

<!-- NAVBAR -->
<nav class="ios-navbar">

    <!-- HOME -->
    <a href="dashboard.html">

        <i class="fa-solid fa-house"></i>

    </a>

    <!-- NOTIFICATIONS -->
    <a href="notifications.html"
   class="nav-bell">

    <i class="fa-solid fa-bell"></i>

    <div id="notification-badge"
         class="notification-badge">

    </div>

</a>

    <!-- PROFILE -->
    <a href="profile.html">

        <img
        src="${ami.avatar || 'default-avatar.png'}"
        class="real-avatar">

    </a>

</nav>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

<script src="script.js"></script>

<script>

afficherBadgeNotifications();

</script>

</body>
</html>
